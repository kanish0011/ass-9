apiVersion: apps/v1
kind: Deployment
metadata:
  name: placement-portal-deployment
  labels:
    app: placement-portal
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: placement-portal
  template:
    metadata:
      labels:
        app: placement-portal
    spec:
      containers:
      - name: placement-portal-container
        # Replace YOUR_DOCKERHUB_USERNAME with your actual Docker Hub username
        image: kanish0011/placement-portal:v1.0
        ports:
        - containerPort: 80
        imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: placement-portal-service
spec:
  type: NodePort
  selector:
    app: placement-portal
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
